[project]
name = "tiny-semver"
version = "1.0.0"
description = "Zero-dependency Semantic Versioning (SemVer 2.0.0). Parse, compare, bump, validate."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hussain Al-Saibai", email = "hussain.alsaibai@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["semver", "semantic-versioning", "version", "zero-dependency", "stdlib"]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-semver"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tiny_semver"]
